name: Wasmtime prebuilds

on:
  pull_request:
    paths:
      - .github/workflows/wasmtime-prebuilds.yml
      - native/wasmtime-executor/**
      - "!native/wasmtime-executor/**/*.md"
  # Runs on main seed the Rust caches that pull requests and release tags restore: Actions
  # caches are shared only from the default branch.
  push:
    branches: [main]
    paths:
      - .github/workflows/wasmtime-prebuilds.yml
      - native/wasmtime-executor/**
      - "!native/wasmtime-executor/**/*.md"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: wasmtime-prebuilds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest:
    name: QuickJS Wasm guest
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust guest build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/wasmtime-executor/queued-guest/target
          key: wasmtime-guest-${{ hashFiles('native/wasmtime-executor/queued-guest/Cargo.lock', 'native/wasmtime-executor/queued-guest/src/**') }}
          restore-keys: wasmtime-guest-
      - name: Install native build dependencies
        # The runner image usually ships libclang, and an apt mirror once stalled this step for 685 s
        # in a release (12-33 s otherwise), so install only when it's missing, with bounded retries.
        timeout-minutes: 10
        run: |
          if ls /usr/lib/llvm-18/lib/libclang*.so* >/dev/null 2>&1; then
            echo "Using the runner's libclang: $(ls /usr/lib/llvm-18/lib/libclang*.so* | tr '\n' ' ')"
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              sudo timeout 180 apt-get -o Acquire::Retries=3 install --yes --no-install-recommends libclang-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying"
          done
          exit 1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add wasm32-wasip2 --toolchain 1.99.0
      - name: Build QuickJS component
        env:
          BINDGEN_EXTRA_CLANG_ARGS: -isystem /usr/lib/llvm-18/lib/clang/18/include
        run: cargo +1.99.0 build --manifest-path native/wasmtime-executor/queued-guest/Cargo.toml --target wasm32-wasip2 --release --locked
      - name: Stage component
        run: |
          mkdir -p dist
          cp native/wasmtime-executor/queued-guest/target/wasm32-wasip2/release/pit_queued_quickjs_guest.wasm dist/pit-queued-quickjs-guest.wasm
      - name: Upload component
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasmtime-guest
          path: dist/pit-queued-quickjs-guest.wasm
          if-no-files-found: error

  smoke-inputs:
    name: smoke-test inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Use lockfile-compatible npm
        run: npm install --global npm@11.17.0
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      # The adapter bundle and prepared program are platform-independent, so the addon jobs
      # download them instead of installing JavaScript dependencies.
      - name: Prepare smoke program and adapter
        run: |
          mkdir -p smoke
          node --import ./scripts/typescript-resolve.mjs native/wasmtime-executor/prepare-smoke.mts smoke/prepared-program.json
          npx esbuild src/sandbox/wasmtime-executor.ts --bundle --platform=node --format=cjs --outfile=smoke/wasmtime-adapter.cjs
      - name: Upload smoke-test inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not wasmtime-*: the release job publishes every artifact matching that pattern.
          name: smoke-inputs
          path: smoke/
          if-no-files-found: error

  addon:
    name: ${{ matrix.target }} addon
    needs: [guest, smoke-inputs]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            library: native/wasmtime-executor/target/release/libpit_wasmtime_executor.so
          - target: linux-x64
            runner: ubuntu-24.04
            library: native/wasmtime-executor/target/release/libpit_wasmtime_executor.so
          - target: darwin-arm64
            runner: macos-15
            library: native/wasmtime-executor/target/release/libpit_wasmtime_executor.dylib
          # Cross-compiled on Apple Silicon, which builds about twice as fast as the Intel runner
          # (283-324 s against 589-615 s); the smoke test runs x64 Node under Rosetta.
          - target: darwin-x64
            runner: macos-15
            rust-target: x86_64-apple-darwin
            node-architecture: x64
            library: native/wasmtime-executor/target/x86_64-apple-darwin/release/libpit_wasmtime_executor.dylib
          - target: win32-arm64
            runner: windows-11-arm
            library: native/wasmtime-executor/target/release/pit_wasmtime_executor.dll
          - target: win32-x64
            runner: windows-2025
            library: native/wasmtime-executor/target/release/pit_wasmtime_executor.dll
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          architecture: ${{ matrix.node-architecture }}
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if [ -n "${{ matrix.rust-target }}" ]; then
            rustup target add "${{ matrix.rust-target }}" --toolchain 1.99.0
          fi
      - name: Cache Rust addon build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/wasmtime-executor/target
          key: wasmtime-addon-${{ matrix.target }}-${{ hashFiles('native/wasmtime-executor/Cargo.lock', 'native/wasmtime-executor/src/**') }}
          restore-keys: wasmtime-addon-${{ matrix.target }}-
      - name: Build native addon
        shell: bash
        run: cargo +1.99.0 build --manifest-path native/wasmtime-executor/Cargo.toml --release --locked ${{ matrix.rust-target && format('--target {0}', matrix.rust-target) || '' }}
      - name: Download QuickJS component
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasmtime-guest
          path: dist
      - name: Download smoke-test inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smoke-inputs
          path: dist
      - name: Stage smoke test
        shell: bash
        run: |
          cp "${{ matrix.library }}" dist/pit_wasmtime_executor.node
          cp "${{ matrix.library }}" "dist/pit-wasmtime-${{ matrix.target }}.node"
          cp dist/pit-queued-quickjs-guest.wasm dist/pit_queued_quickjs_guest.wasm
          cp native/wasmtime-executor/smoke.cjs dist/smoke.cjs
      - name: Smoke-test native addon
        shell: bash
        run: |
          # Each addon must be tested on its own platform, including x64 Node under Rosetta.
          node -e 'const actual = `${process.platform}-${process.arch}`; if (actual !== process.argv[1]) { console.error(`Node is ${actual}, not ${process.argv[1]}`); process.exit(1); }' "${{ matrix.target }}"
          cd dist && node smoke.cjs
      - name: Upload native addon
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasmtime-${{ matrix.target }}
          path: dist/pit-wasmtime-${{ matrix.target }}.node
          if-no-files-found: error

  suite:
    name: test suite on freshly built linux-x64 natives
    needs: addon
    # The release job already tests its own artifacts; this covers native changes in PRs.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Use lockfile-compatible npm
        run: npm install --global npm@11.17.0
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Download freshly built runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasmtime-{guest,linux-x64}
          path: dist
          merge-multiple: true
      - name: Install freshly built linux-x64 runtime
        run: |
          mkdir -p native/prebuilds/linux-x64
          cp dist/pit-wasmtime-linux-x64.node native/prebuilds/linux-x64/pit_wasmtime_executor.node
          cp dist/pit-queued-quickjs-guest.wasm native/prebuilds/linux-x64/pit_queued_quickjs_guest.wasm
      - name: Check jq for workflow query tests
        run: jq --version
      - name: Test
        run: npm test
