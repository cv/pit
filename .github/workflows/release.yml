name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Use lockfile-compatible npm
        run: npm install --global npm@11.17.0
      - name: Install dependencies
        run: npm ci
      - name: Verify tag and package version
        run: |
          package_version=$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.version)')
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Verify package
        run: npm run package:check
      - name: Run static checks
        run: npm run check
      # The tagged commit passed tests and coverage in CI; Pit installs from the tagged source.
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "pit $GITHUB_REF_NAME" --generate-notes
