name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prebuilds:
    uses: ./.github/workflows/wasmtime-prebuilds.yml

  release:
    name: release
    needs: prebuilds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Use lockfile-compatible npm
        run: npm install --global npm@11.17.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify tag and package version
        run: |
          package_version=$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.version)')
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Download release prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wasmtime-*
          path: dist
          merge-multiple: true
      - name: Install this release's linux-x64 runtime for tests
        run: |
          mkdir -p native/prebuilds/linux-x64
          cp dist/pit-wasmtime-linux-x64.node native/prebuilds/linux-x64/pit_wasmtime_executor.node
          cp dist/pit-queued-quickjs-guest.wasm native/prebuilds/linux-x64/pit_queued_quickjs_guest.wasm
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Verify package
        run: npm run package:check
      - name: Run static checks
        run: npm run check
      # The tagged commit passed coverage in CI; this run tests the freshly built runtime.
      - name: Test this release's runtime
        run: npm test
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Generate prebuild checksums
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readdir, readFile, writeFile } from "node:fs/promises";
          import manifest from "./package.json" with { type: "json" };

          const files = (await readdir("dist")).sort();
          const checksums = {};
          for (const file of files) {
            checksums[file] = createHash("sha256").update(await readFile(`dist/${file}`)).digest("hex");
          }
          await writeFile(
            "dist/pit-wasmtime-checksums.json",
            `${JSON.stringify({ version: manifest.version, files: checksums }, null, 2)}\n`,
          );
          NODE
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "pit $GITHUB_REF_NAME" --generate-notes
