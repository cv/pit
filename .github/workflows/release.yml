name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Use lockfile-compatible npm
        run: npm install --global npm@11.17.0
      - name: Install dependencies
        run: npm ci
      - name: Verify tag and package version
        run: |
          package_version=$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.version)')
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Verify package
        run: npm run package:check
      - name: Run static checks
        run: npm run check
      - name: Test with coverage
        run: npm run coverage
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "pit $GITHUB_REF_NAME" --generate-notes
