version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Pi pins typebox for Pit at runtime; scripts/verify-package.mjs requires Pi's exact version,
    # so typebox moves only with a Pi upgrade.
    ignore:
      - dependency-name: typebox
    groups:
      compatible-development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - "@earendil-works/pi-*"
          - oxfmt
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-actions:
        patterns: ["*"]
        update-types: [minor, patch]
