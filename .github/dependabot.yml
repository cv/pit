version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - "@earendil-works/pi-*"
          - oxfmt
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    groups:
      compatible-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - /native/wasmtime-executor
      - /native/wasmtime-executor/queued-guest
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-crates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
