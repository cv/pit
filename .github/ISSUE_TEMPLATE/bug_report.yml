name: Bug report
description: Report reproducible incorrect behavior in Pit
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a Pit problem. Do not include secrets or private session data.
  - type: input
    id: pit-version
    attributes:
      label: Pit version
      placeholder: v0.14.1
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      placeholder: 0.85.1
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 22.19.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Pi mode
      options: [TUI, print, RPC, other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include sanitized diagnostics only. Follow SECURITY.md for vulnerabilities.
