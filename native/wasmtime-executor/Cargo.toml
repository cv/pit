[package]
name = "pit-wasmtime-executor"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
futures = "0.3.31"
napi = { version = "3.12.6", default-features = false, features = ["async", "napi8"] }
napi-derive = "3.6.7"
wasmtime = "48.0.2"
wasmtime-wasi = "48.0.2"

[build-dependencies]
napi-build = "2.4.3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
